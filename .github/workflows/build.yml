name: 앱 빌드

# 파이썬 실행 파일은 교차 빌드가 안 된다. 맥에서 .exe 를, 윈도우에서 .app 을
# 만들 수 없다. 그래서 깃허브가 빌려주는 윈도우 머신과 맥 머신에서 각각 빌드한다.
on:
  push:
    tags: ["v*"]          # v1.0.0 같은 태그를 올리면 두 판을 만들어 릴리스에 붙인다
  workflow_dispatch: {}   # 깃허브 화면에서 손으로도 돌릴 수 있다 (릴리스는 안 만든다)
  pull_request:           # PR 마다 두 판이 빌드되는지 확인한다 (릴리스는 안 만든다)

# 릴리스를 만들고 파일을 붙이려면 쓰기 권한이 있어야 한다.
# 저장소 기본값(읽기 전용)으로는 마지막 단계가 403 으로 막힌다.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 엔진 빌드
        shell: pwsh
        run: .\windows\build_windows.ps1

      - name: 결과 확인
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\Meridian\Meridian.exe")) { throw "exe 가 만들어지지 않았습니다" }
          Get-ChildItem -Recurse dist\Meridian | Measure-Object Length -Sum |
            ForEach-Object { "크기: {0:N0} MB" -f ($_.Sum / 1MB) }

      - name: .NET 8 준비
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: MSBuild 준비
        uses: microsoft/setup-msbuild@v2

      - name: 네이티브 화면 빌드 (WinUI 3)
        shell: pwsh
        run: |
          # dotnet 의 MSBuild 에는 WinUI 가 쓰는 리소스 패키징 작업(ExpandPriContent)이
          # 없다. 비주얼 스튜디오 쪽 MSBuild 로 빌드해야 한다.
          msbuild winui\Meridian.WinUI.csproj /restore /t:Publish `
            /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true /p:PublishDir=$PWD\publish\ /v:minimal
          if (-not (Test-Path "publish\Meridian.exe")) { throw "화면 exe 가 만들어지지 않았습니다" }
          # 컴파일된 XAML 이 든 리소스 파일. 빠져도 빌드는 '성공' 하지만, exe 를 누르면
          # 창이 뜨기도 전에 아무 말 없이 꺼진다 (v1.0.0 첫 배포에서 실제로 그랬다).
          if (-not (Test-Path "publish\Meridian.pri")) {
            Write-Host "--- 빌드가 만든 리소스 파일들"
            Get-ChildItem -Recurse winui\bin, winui\obj, publish -Include *.pri, *.xbf -ErrorAction SilentlyContinue |
              ForEach-Object { "{0,10}  {1}" -f $_.Length, $_.FullName }
            throw "Meridian.pri 가 없습니다 — 실행하면 곧바로 꺼집니다"
          }

      - name: 엔진을 화면 폴더 안으로
        shell: pwsh
        run: |
          # 화면은 같은 폴더의 engine\Meridian.exe 를 자식 프로세스로 띄운다
          New-Item -ItemType Directory -Force -Path publish\engine | Out-Null
          Copy-Item -Recurse -Force dist\Meridian\* publish\engine\
          $size = [math]::Round((Get-ChildItem -Recurse publish | Measure-Object Length -Sum).Sum / 1MB)
          Write-Host "합친 크기: ${size}MB"

      - name: 실제로 켜지는지 확인
        shell: pwsh
        run: |
          # 빌드가 '성공' 해도 실행하면 곧바로 꺼지는 경우가 있었다. 직접 띄워 본다.
          # 20초 동안 살아 있으면 통과. 죽으면 App 이 남긴 crash.log 를 보여 준다.
          $p = Start-Process -FilePath "publish\Meridian.exe" -PassThru
          Start-Sleep -Seconds 20
          $log = Join-Path $env:LOCALAPPDATA "Meridian\crash.log"
          if ($p.HasExited) {
            if (Test-Path $log) { Get-Content $log }
            throw "Meridian.exe 가 켜지자마자 꺼졌습니다 (종료 코드 $($p.ExitCode))"
          }
          if (Test-Path $log) { Get-Content $log; throw "실행 중 오류가 기록됐습니다" }
          Write-Host "20초 동안 정상 실행됨"
          # 화면과 그 아래 엔진까지 함께 끈다
          taskkill /PID $p.Id /T /F | Out-Null

      - name: 설치 프로그램 만들기 (Inno Setup)
        shell: pwsh
        run: |
          # 태그(v1.2.3)면 그 번호를, 아니면 0.0.0 을 설치 프로그램 버전으로 쓴다
          $ver = if ("${{ github.ref }}" -like "refs/tags/v*") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc /Q "/DAppVersion=$ver" "/DSourceDir=$PWD\publish" windows\meridian.iss
          if ($LASTEXITCODE -ne 0) { throw "설치 프로그램을 만들지 못했습니다" }
          if (-not (Test-Path "dist\Meridian-Setup.exe")) { throw "Meridian-Setup.exe 가 없습니다" }
          "설치 프로그램: {0:N0} MB (버전 $ver)" -f ((Get-Item dist\Meridian-Setup.exe).Length / 1MB)

      - name: 내려받을 수 있게 올리기
        uses: actions/upload-artifact@v4
        with:
          name: Meridian-windows
          path: dist/Meridian-Setup.exe
          retention-days: 14

  mac:
    runs-on: macos-latest       # Apple Silicon. 결과물도 Apple Silicon 전용이다
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: 앱 빌드
        run: ./build_app.sh

      - name: 결과 확인과 DMG 만들기
        run: |
          test -x dist/Meridian.app/Contents/MacOS/Meridian || { echo "앱이 만들어지지 않았습니다"; exit 1; }
          # 열면 앱과 '응용 프로그램' 바로가기가 나란히 보여, 끌어다 놓으면 설치가 끝난다.
          # 번들 안의 심볼릭 링크와 서명을 지키려면 cp 가 아니라 ditto 로 옮겨야 한다.
          mkdir -p dmg
          ditto dist/Meridian.app dmg/Meridian.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname Meridian -srcfolder dmg -ov -format UDZO Meridian-mac.dmg
          du -sh dist/Meridian.app Meridian-mac.dmg

      - name: 내려받을 수 있게 올리기
        uses: actions/upload-artifact@v4
        with:
          name: Meridian-mac
          path: Meridian-mac.dmg
          retention-days: 14

  release:
    # 두 판이 모두 성공했을 때만, 태그를 올렸을 때만 릴리스를 만든다
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 올릴 파일 모으기
        run: |
          cp artifacts/Meridian-windows/Meridian-Setup.exe .
          cp artifacts/Meridian-mac/Meridian-mac.dmg .
          ls -lh Meridian-Setup.exe Meridian-mac.dmg

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Meridian-Setup.exe
            Meridian-mac.dmg
          # 깃허브 화면에서 릴리스를 만들며 설명을 적었으면 그 아래에 덧붙인다 (덮어쓰지 않는다)
          append_body: true
          body: |

            ---
            ## 내려받기
            - **Windows** (10 1809 이상, x64): `Meridian-Setup.exe` — 실행해서 설치하면 시작 메뉴와 바탕화면에 Meridian 이 생깁니다
            - **macOS** (Apple Silicon, 11 이상): `Meridian-mac.dmg` — 열고 `Meridian` 을 옆의 응용 프로그램 폴더로 끌어다 놓기

            ## 처음 실행할 때
            서명이 없어서 한 번 막힙니다.
            - **Windows**: 설치 파일을 열 때 "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행**
            - **macOS**: 열리지 않는다고 나오면 **시스템 설정 → 개인정보 보호 및 보안** 맨 아래의 **그래도 열기**
