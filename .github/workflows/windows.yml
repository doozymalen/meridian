name: 윈도우 앱 빌드

# 파이썬 실행 파일은 교차 빌드가 안 된다. 맥에서도, 리눅스 클라우드에서도
# .exe 를 만들 수 없다. 그래서 깃허브가 빌려주는 윈도우 머신에서 빌드한다.
on:
  push:
    tags: ["v*"]          # v1.0 같은 태그를 올리면 릴리스까지 만든다
  workflow_dispatch: {}   # 깃허브 화면에서 손으로도 돌릴 수 있다

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 빌드
        shell: pwsh
        run: .\windows\build_windows.ps1

      - name: 결과 확인
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\Meridian\Meridian.exe")) { throw "exe 가 만들어지지 않았습니다" }
          Get-ChildItem -Recurse dist\Meridian | Measure-Object Length -Sum |
            ForEach-Object { "크기: {0:N0} MB" -f ($_.Sum / 1MB) }

      - name: .NET 8 준비
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 네이티브 화면 빌드 (WinUI 3)
        shell: pwsh
        run: |
          dotnet publish winui\Meridian.WinUI.csproj -c Release -r win-x64 `
            -p:Platform=x64 -o publish
          if (-not (Test-Path "publish\Meridian.exe")) { throw "화면 exe 가 만들어지지 않았습니다" }

      - name: 엔진을 화면 폴더 안으로
        shell: pwsh
        run: |
          # 화면은 같은 폴더의 engine\Meridian.exe 를 자식 프로세스로 띄운다
          New-Item -ItemType Directory -Force -Path publish\engine | Out-Null
          Copy-Item -Recurse -Force dist\Meridian\* publish\engine\
          $size = [math]::Round((Get-ChildItem -Recurse publish | Measure-Object Length -Sum).Sum / 1MB)
          Write-Host "합친 크기: ${size}MB"

      - name: 내려받을 수 있게 올리기
        uses: actions/upload-artifact@v4
        with:
          name: Meridian-windows
          path: publish/
          retention-days: 14

      - name: 태그를 올렸으면 릴리스에도 붙인다
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath Meridian-windows.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: Meridian-windows.zip
